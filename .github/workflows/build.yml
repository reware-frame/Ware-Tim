name: Build and Test

on:
  push:
    branches: [ master, 'claude/**' ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: Build & Test (Java 8)
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:6-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      zookeeper:
        image: zookeeper:3.8-temurin
        ports:
          - 2181:2181
        env:
          ZOO_MY_ID: 1
          ZOO_4LW_COMMANDS_WHITELIST: "*"
        options: >-
          --health-cmd "echo ruok | nc localhost 2181 | grep imok"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven (skip tests)
        run: mvn -B -Dmaven.test.skip=true clean package

      - name: Run unit tests
        run: mvn -B test
        env:
          # 测试时使用 CI 环境的 Redis 和 ZK
          SPRING_REDIS_HOST: localhost
          SPRING_REDIS_PORT: 6379
          APP_ZK_ADDR: localhost:2181

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/target/surefire-reports/*.xml'
          retention-days: 7

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cim-jars
          path: |
            cim-server/target/cim-server-*.jar
            cim-client/target/cim-client-*.jar
            cim-forward-route/target/cim-forward-route-*.jar
          retention-days: 7
